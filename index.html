<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UniTasks es un software de gestión académica diseñado para alumnos de la UABCS">
  <meta name="author" content="Alexa Gavarain, Jorge Mercado">
  <meta name="keywords" content="estudio, tareas, agenda, UABCS, universidad, gestión académica">
  <meta name="robots" content="index">
  <meta name="twitter:card" content="summary_large_image">
  <title>UniTasks: Gestión académica para alumnos de la UABCS</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="canonical" href="index.html">
  <link rel="icon" href="assets/icons/unitasks-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body class="layout" id="top">
  <div class="sidebar">
    <header class="sidebar__header">
      <div class="sidebar__app-logo">
        <img class="sidebar__app-icon" src="assets/img/unitasks-logo.png" alt="Logo UniTasks" width="30" height="30">
        <span class="sidebar__app-name">UniTasks</span>
      </div>
      <button class="sidebar__menu-icon" id="menu-button" type="button">
        <img src="assets/icons/menu-icon.svg" alt="Ícono menú" width="20" height="20">
      </button>
    </header>

    <aside class="sidebar__body">
      <div class="separator-line"></div>
      <div class="sidebar__user-profile">
        <img class="sidebar__user-profile__icon" src="assets/img/user-pfp.png" alt="Foto de perfil" width="30"
          height="30">
        <div class="sidebar__user-profile__data">
          <span class="sidebar__user-profile__data__name">Nombre Apellido</span>
          <span class="sidebar__user-profile__data__career">Carrera</span>
          <span class="sidebar__user-profile__data__semester">Semestre</span>
        </div>
      </div>
      <div class="separator-line"></div>
      <nav>
        <ul class="sidebar__navbar">
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/tasks-icon.svg" alt="Ícono tareas" width="20" height="20">
            <a href="pages/tasks.html" title="Ir a mis tareas">Tareas</a>
          </li>
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/calendar-icon.svg" alt="Ícono calendario" width="20"
              height="20">
            <a href="pages/calendar.html" title="Ir a mi calendario">Calendario</a>
          </li>
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/classes-icon.svg" alt="Ícono clases" width="20" height="20">
            <a href="pages/classes.html" title="Ir a mis clases">Clases</a>
          </li>
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/curricular-map-icon.svg" alt="Ícono mapa curricular" width="20"
              height="20">
            <a href="pages/curriculum.html" title="Ir a mi mapa curricular">Mapa curricular</a>
          </li>
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/meetings-icon.svg" alt="Ícono reuniones" width="20"
              height="20">
            <a href="pages/meetings.html" title="Ir a mis reuniones">Reuniones</a>
          </li>
          <li><a class="sidebar__register-link" href="pages/register.html" title="Ir al registro">Registro</a></li>
          <button class="theme-button" id="theme-button" type="button">
            <img class="theme-button__icon" src="assets/icons/light-dark-mode-icon.svg" alt="Ícono modo claro/oscuro"
              width="20" height="20">
          </button>
        </ul>
      </nav>
    </aside>
  </div>

  <div class="tasks">
    <header class="tasks__header">
      <div class="tasks__header_left-elements">
        <h1 class="tasks__title-box">Tareas</h1>
        <p class="tasks__summary"></p>
      </div>
      <div class="tasks__search-bar-container">
        <img class="search-icon" src="assets/icons/search-icon.svg" alt="Ícono de búsqueda" width="12" height="">
        <!-- <input placeholder="Buscar tareas...""> -->
      </div>
      <button class="new-task-button" id="new-task-button" type="button">
        <img class="new-task-button__icon new-task-button__icon--normal" src="assets/icons/plus-icon.svg"
          alt="Ícono nueva tarea" width="12" height="12">
        <img class="new-task-button__icon new-task-button__icon--hover" src="assets/icons/plus-icon-blue.svg"
          alt="Ícono nueva tarea" width="12" height="12">
        Nueva tarea
      </button>
    </header>

    <div class="subjects-menu"></div>
    <main class="tasks__content"></main>
  </div>

  <!-- MODAL DE NUEVA TAREA -->

  <dialog id="new-task-modal" class="modal">
    <form class="form-container" id="new-task-form" action="/create-new-task" method="POST" novalidate>
      <header class="new-task-modal__header">
        <h2 class="new-task-modal__title">Nueva tarea</h2>
        <button class="task-modal__close" id="close-modal-btn" type="button" aria-label="Cerrar modal">✕</button>
      </header>
      <div class="new-task-modal__body">
        <div class="input-field">
          <label class="form-label" for="task-title">Título</label>
          <input class="long-form-input" autofocus required type="text" id="task-title" name="title"
            placeholder="Título de la tarea">
          <span class="field-error" data-error-para="title"></span>
        </div>

        <div class="input-field">
          <label class="form-label" for="task-description">Descripción</label>
          <textarea class="long-form-input" required id="task-description" name="description" rows="5" cols="40"
            placeholder="Escribe una descripción..."></textarea>
        </div>

        <div class="input-field">
          <label class="form-label" for="task-subject">Materia</label>
          <select class="long-form-input" required id="task-subject" name="subject">
            <option value="" selected disabled>Selecciona una materia</option>
            <option value="database-2">Base de Datos II</option>
            <option value="web-programming">Programación Web</option>
            <option value="software-engineering-1">Ingeniería de Software I</option>
            <option value="user-interface-design">Diseño de Interfaces de Usuario</option>
            <option value="computation-theory">Teoría de la Computación</option>
            <option value="networks-1">Redes I</option>
          </select>
        </div>

        <div class="input-field">
          <label class="form-label" for="task-due-date">Fecha de entrega</label>
          <input class="long-form-input" required type="date" id="task-due-date" name="due_date">
          <span class="field-error" data-error-para="due_date"></span>
        </div>

        <div class="input-field">
          <label class="form-label" for="task-due-time">Hora de entrega</label>
          <input class="long-form-input" required type="time" id="task-due-time" name="due_time">
          <span class="field-error" data-error-para="due_time"></span>
        </div>

        <div>
          <button id="cancel-modal-btn" type="reset">Cancelar</button>
          <button id="save-modal-btn" type="submit">Guardar</button>
        </div>
      </div>
    </form>
  </dialog>

  <footer class="footer">
    <p>Software desarrollado por UniTasks®</p>
  </footer>
  <a class="back-to-top" href="#top">↑</a>
  </div>
  <script type="module" src="./js/index.js"></script>
</body>

</html>
