<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UniTasks es un software de gestión académica diseñado para alumnos de la UABCS">
  <meta name="author" content="Alexa Gavarain, Jorge Mercado">
  <meta name="keywords" content="estudio, tareas, agenda, UABCS, universidad, gestión académica">
  <meta name="robots" content="index">
  <meta name="twitter:card" content="summary_large_image">
  <title>UniTasks: Gestión académica para alumnos de la UABCS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="canonical" href="index.html">
  <link rel="icon" href="assets/icons/unitasks-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body class="layout" id="top">
  <div class="sidebar">
    <header class="sidebar__header">
      <button class="sidebar__menu-icon" id="menu-button" type="button">
        <img class="sidebar__icon" src="assets/icons/menu-icon.svg" alt="Ícono menú" width="20" height="20">
      </button>
      <div class="sidebar__app-logo">
        <img class="sidebar__app-icon" src="assets/img/unitasks-logo.png" alt="Logo UniTasks" width="30" height="30">
        <span class="sidebar__app-name">UniTasks</span>
      </div>
      <button class="theme-button" id="theme-button" type="button">
        <img class="theme-button__icon" src="assets/icons/light-dark-mode-icon.svg" alt="Ícono modo claro/oscuro"
          width="20" height="20">
      </button>
    </header>

    <aside class="sidebar__body">
      <div class="separator-line"></div>
      <div class="sidebar__user-profile">
        <img class="sidebar__user-profile__icon" src="assets/img/user-pfp.png" alt="Foto de perfil" width="30"
          height="30">
        <div class="sidebar__user-profile__data">
          <span class="sidebar__user-profile__data__name">Nombre Apellido</span>
          <span class="sidebar__user-profile__data__career">Carrera</span>
          <span class="sidebar__user-profile__data__semester">Semestre</span>
        </div>
      </div>
      <div class="separator-line"></div>
      <nav>
        <ul class="sidebar__navbar">
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/tasks-icon.svg" alt="Ícono tareas" width="20" height="20">
            <a href="pages/tasks.html" title="Ir a mis tareas">Tareas</a>
          </li>
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/calendar-icon.svg" alt="Ícono calendario" width="20"
              height="20">
            <a href="pages/calendar.html" title="Ir a mi calendario">Calendario</a>
          </li>
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/classes-icon.svg" alt="Ícono clases" width="20" height="20">
            <a href="pages/classes.html" title="Ir a mis clases">Clases</a>
          </li>
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/curricular-map-icon.svg" alt="Ícono mapa curricular" width="20"
              height="20">
            <a href="pages/curriculum.html" title="Ir a mi mapa curricular">Mapa curricular</a>
          </li>
          <li class="sidebar__navbar-item">
            <img class="sidebar__icon" src="assets/icons/meetings-icon.svg" alt="Ícono reuniones" width="20"
              height="20">
            <a href="pages/meetings.html" title="Ir a mis reuniones">Reuniones</a>
          </li>
          <li class="sidebar__navbar__secondary-link"><a href="pages/bootstrap.html">Bootstrap</a></li>
          <li class="sidebar__navbar__secondary-link"><a href="pages/tailwind.html">Tailwind</a></li>
        </ul>
      </nav>
    </aside>
  </div>

  <div class="tasks">
    <header class="tasks__header">
      <div class="tasks__header_left-elements">
        <h1 class="tasks__title-box">Tareas</h1>
        <p class="tasks__summary"></p>
      </div>
      <button class="new-task-button" id="new-task-button" type="button"
        onclick="window.location.href='pages/new-task.html'">
        <img class="new-task-button__icon new-task-button__icon--normal" src="assets/icons/plus-icon.svg"
          alt="Ícono nueva tarea" width="12" height="12">
        <img class="new-task-button__icon new-task-button__icon--hover" src="assets/icons/plus-icon-blue.svg"
          alt="Ícono nueva tarea" width="12" height="12">
        Nueva tarea
      </button>
    </header>

    <main class="tasks__content">
      <div class="subjects-menu"></div>
      <section id="pending-tasks">
        <div class="pending-tasks__title">
          <img class="tasks__status-dot" src="assets/icons/pending-tasks-dot.svg" alt="Ícono tareas pendientes"
            width="5" height="5">
          <h2 id="pending-tasks__title-txt" class="tasks__status-title"></h2>
        </div>

        <div id="pending-tasks__list" class="tasks__list"></div>

        <section id="completed-tasks">
          <div class="completed-tasks__title">
            <img class="tasks__status-dot" src="assets/icons/completed-tasks-dot.svg" alt="Ícono tareas completadas"
              width="5" height="5">
            <h2 id="completed-tasks__title-txt" class="tasks__status-title"></h2>
          </div>

          <div id="completed-tasks__list" class="tasks__list"></div>
  </div>
  </section>
  </main>
  </div>

  <footer class="footer">
    <p>Software desarrollado por UniTasks®</p>
  </footer>
  <a class="back-to-top" href="#top">↑</a>
  </div>
  <script src="js/index.js"></script>
</body>

</html>
