<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario para registrar una nueva tarea en UniTasks">
  <meta name="author" content="Alexa Gavarain, Jorge Mercado">
  <title>Nueva tarea | UniTasks</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../assets/icons/unitasks-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body class="new-task__body">
  <header class="page-header">
    <div class="page-header__app-logo">
      <img class="page-header__app-icon" src="../assets/img/unitasks-logo.png" alt="Logo UniTasks" width="30"
        height="30">
      <span class="page-header__app-name">UniTasks</span>
    </div>
    <button class="theme-button" id="theme-button" type="button">
      <img class="theme-button__icon" src="../assets/icons/light-dark-mode-icon.svg" alt="Ícono modo claro/oscuro"
        width="20" height="20">
    </button>
  </header>

  <header>
    <h1 class="new-task__title">Nueva tarea</h1>
  </header>

  <main class="new-task__main">
    <div class="new-task__modal">
      <form id="new-task-form" action="/process-task" method="GET" novalidate>
        <div>
          <label class="new-task__form-label" for="task-title">Título</label>
          <input class="new-task__long-form-input" autofocus required type="text" id="task-title" name="title"
            placeholder="Título de la tarea">
        </div>

        <div>
          <label class="new-task__form-label" for="task-description">Descripción</label>
          <textarea class="new-task__long-form-input" required id="task-description" name="description" rows="5"
            cols="40" placeholder="Escribe una descripción..."></textarea>
        </div>

        <div>
          <label class="new-task__form-label" for="task-subject">Materia</label>
          <select class="new-task__long-form-input" required id="task-subject" name="subject">
            <option value="" selected disabled>Selecciona una materia</option>
            <option value="database-2">Base de Datos II</option>
            <option value="web-programming">Programación Web</option>
            <option value="software-engineering-1">Ingeniería de Software I</option>
            <option value="user-interface-design">Diseño de Interfaces de Usuario</option>
            <option value="computation-theory">Teoría de la Computación</option>
            <option value="networks-1">Redes I</option>
          </select>
        </div>

        <div>
          <label class="new-task__form-label" for="task-due-date">Fecha de entrega</label>
          <input class="new-task__long-form-input" required type="date" id="task-due-date" name="due_date">
        </div>

        <div>
          <label class="new-task__form-label" for="task-due-time">Hora de entrega</label>
          <input class="new-task__long-form-input" required type="time" id="task-due-time" name="due_time">
        </div>

        <div>
          <button id="new-task-cancel" type="reset">Cancelar</button>
          <button id="new-task-save" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </main>
  <script src="../js/new-task.js"></script>
</body>

</html>
