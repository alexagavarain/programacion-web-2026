<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de registro de alumnos en UniTasks">
  <meta name="author" content="Alexa Gavarain, Jorge Mercado">
  <title>Registro | UniTasks</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../assets/icons/unitasks-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body class="register__body">
  <header class="page-header">
    <div class="page-header__app-logo">
      <img class="page-header__app-icon" src="../assets/img/unitasks-logo.png" alt="Logo UniTasks" width="30"
        height="30">
      <span class="page-header__app-name">UniTasks</span>
    </div>
    <button class="theme-button" id="theme-button" type="button">
      <img class="theme-button__icon" src="../assets/icons/light-dark-mode-icon.svg" alt="Ícono modo claro/oscuro"
        width="20" height="20">
    </button>
  </header>

  <main class="register__main">
    <h1 class="form-title">Registro</h1>
    <form id="register-form" action="/register-user" method="POST" enctype="multipart/form-data" novalidate>
      <fieldset class="form-container">

        <div class="input-field">
          <label class="form-label" for="inp-name">Nombre(s)</label>
          <input class="long-form-input" autofocus required minlength="3" type="text" name="name" id="inp-usuario"
            placeholder="Nombre(s)">
          <span class="field-error" data-error-para="name"></span>
        </div>

        <div class="input-field">
          <label class="form-label" for="inp-lastname">Apellidos</label>
          <input class="long-form-input" autofocus required minlength="3" type="text" name="last-name" id="inp-usuario"
            placeholder="Primer apellido Segundo apellido">
          <span class="field-error" data-error-para="last-name"></span>
        </div>

        <div class="input-field">
          <label class="form-label" for="inp-email">Correo electrónico</label>
          <input class="long-form-input" required type="email" name="email" id="inp-email"
            placeholder="estudiante@alu.uabcs.mx">
          <span class="field-error" data-error-para="email"></span>
        </div>

        <div class="input-field">
          <label class="form-label" for="inp-password">Contraseña</label>
          <input class="long-form-input" required minlength="8" type="password" name="password" id="inp-password"
            placeholder="Ingresa tu contraseña">
          <span class="field-error" data-error-para="password"></span>
        </div>

        <div class="input-field">
          <label class="form-label" for="sel-career">Carrera</label>
          <select class="long-form-input" required id="sel-career" name="career">
            <option value="Ingenieria en Desarrollo de Software" selected>IDS</option>
            <option value="Ingeniería en Tecnologías Computacionales">ITC</option>
            <option value="Ingeniería en Ciberseguridad">IC</option>
            <option value="Licenciatura en Administración de Tecnologías de la Información">LATI</option>
          </select>
        </div>

        <div class="input-field">
          <label class="form-label" for="sel-semester">Semestre</label>
          <select class="long-form-input" required id="sel-semester" name="semester">
            <option value="1" selected>1</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="9">9</option>
          </select>
        </div>

        <div class="input-field">
          <label class="form-label" for="sel-group">Grupo</label>
          <select class="long-form-input" required id="sel-group" name="group">
            <option value="A" selected>A</option>
            <option value="B">B</option>
          </select>
        </div>

        <div class="register__radio-field">
          <label class="form-label">Turno</label>
          <span class="register__radio-input">
            <label for="rad-matutino">Matutino</label>
            <input type="radio" id="rad-matutino" name="shift" value="M" checked>
          </span>
          <span class="register__radio-input">
            <label for="rad-vespertino">Vespertino</label>
            <input type="radio" id="rad-vespertino" name="shift" value="V">
          </span>
        </div>


      </fieldset>

      <div>
        <button id="register-button" type="submit">Registrarme</button>
      </div>
    </form>
    <div id="success-message" class="success-message hidden" role="status">
      Tu cuenta ha sido registrada
    </div>


  </main>
  <script type="module" src="../js/register.js"></script>
</body>

</html>
