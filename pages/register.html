<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <h1 class="register-title">Registro</h1>
  <form action="/registrar-usuario" method="POST" enctype="multipart/form-data">
    <fieldset class="form-container">

      <div class="input-field">
        <label for="inp-usuario">Nombre completo</label>
        <input autofocus required type="text" name="nombre_usuario" id="inp-usuario" placeholder="Nombre Apellido(s)">
      </div>

      <div class="input-field">
        <label for="inp-email">Correo electrónico</label>
        <input required type="email" name="email" id="inp-email" placeholder="estudiante@alu.uabcs.mx">
      </div>

      <div class="input-field">
        <label for="inp-password">Contraseña</label>
        <input required type="password" name="password" id="inp-password" placeholder="Ingresa tu contraseña">
      </div>

      <div class="input-field">
        <label for="sel-career">Carrera</label>
        <select required id="sel-career" name="career">
          <option value="Ingenieria en Desarrollo de Software" selected>IDS</option>
          <option value="Ingeniería en Tecnologías Computacionales">ITC</option>
          <option value="Ingeniería en Ciberseguridad">IC</option>
          <option value="Licenciatura en Administración de Tecnologías de la Información">LATI</option>
        </select>
      </div>

      <div class="input-field">
        <label for="sel-semester">Semestre</label>
        <select required id="sel-semester" name="semester">
          <option value="1" selected>1</option>
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </div>

      <div class="input-field">
        <label for="sel-group">Grupo</label>
        <select required id="sel-group" name="group">
          <option value="A" selected>A</option>
          <option value="B">B</option>
        </select>
      </div>

      <div class="input-field">
        <label>Turno</label>
        <label for="rad-matutino">Matutino</label>
        <input type="radio" id="rad-matutino" name="shift" value="M" checked>
        <label for="rad-vespertino">Vespertino</label>
        <input type="radio" id="rad-vespertino" name="shift" value="V">
      </div>

    </fieldset>

    <div>
      <button id="register-button" type="submit">Registrarme</button>
    </div>
  </form>
</body>

</html>
