<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTasks: Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

  <article class="card flex-row shadow-sm" style="max-width: 300px;">
    <div class="bg-success rounded-start" style="width: 8px;"></div>
    <div class="card-body d-flex gap-3">
      <img src="../assets/icons/pending-check-icon.svg" alt="Check desmarcado" width="18" height="18">

      <div class="flex-grow-1">
        <div class="d-flex align-items-center justify-content-between">
          <h3 class="card-title fw-medium fs-6">Título de la tarea</h3>
          <img src="../assets/icons/edit-icon.svg" alt="Editar tarea" width="12" height="12">
        </div>

        <p class="card-text text-muted small">Descripción de la tarea</p>

        <div class="d-flex align-items-center justify-content-between">
          <span class="badge bg-success-subtle rounded-pill text-success fw-medium">Materia</span>
          <span class="d-flex text-muted small align-items-center gap-1">
            <img src="../assets/icons/date-icon.svg" alt="Fecha de la tarea" width="12" height="12">
            <span>00/00/00</span>
          </span>
        </div>
      </div>
    </div>
  </article>

</body>

</html>
