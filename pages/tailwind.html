<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTasks: Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-10">

  <article class="flex flex-row border border-slate-200 shadow-sm rounded-xl max-w-[300px]">

    <div class="w-2 bg-emerald-600 rounded-l-xl"></div>

    <div class="flex items-start gap-3 p-3 w-full">

      <img src="../assets/icons/pending-check-icon.svg" alt="Check desmarcado" width="18" height="18">

      <div class="flex-1">

        <div class="flex justify-between items-center gap-1">
          <h3 class="text-sm font-medium truncate mb-2">Título de la tarea</h3>
          <img src="../assets/icons/edit-icon.svg" alt="Editar tarea" width="12" height="12">
        </div>

        <p class="text-xs text-slate-600 mb-3">Descripción de la tarea</p>

        <div class="flex items-center justify-between gap-2">
          <span class="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-0.5 rounded-full font-medium">Materia</span>
          <span class="flex items-center gap-1 text-xs text-slate-600">
            <img src="../assets/icons/date-icon.svg" alt="Fecha de la tarea" width="12" height="12">
            <span>00/00/00</span>
          </span>
        </div>

      </div>
    </div>

  </article>

</body>

</html>
